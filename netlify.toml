# Netlify Configuration for Grow More School Management System
# This file configures the build and deployment settings for the web version

[build]
  # Build command - using react-scripts build
  command = "npm run build"
  
  # Directory where build output is placed
  publish = "build"
  
  # Environment variables for build
  [build.environment]
    NODE_VERSION = "20"
    REACT_APP_VERSION = "1.4.2"
    # Increase Node memory limit for large builds (8GB for Netlify)
    NODE_OPTIONS = "--max-old-space-size=2048"
    # Disable source maps in production to reduce bundle size
    GENERATE_SOURCEMAP = "false"

# SPA Redirect Rule - Critical for React Router
# This ensures all routes are handled by index.html (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets for better performance
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache the service worker or HTML files
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
