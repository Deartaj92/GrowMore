<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./patternLogo.png" />
    <link rel="apple-touch-icon" href="./patternLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GrowMore Teachers Portal — attendance, class timetable, homework diary, marks, and school communications." />
    <meta name="theme-color" content="#0f172a" />
    <title>GrowMore Teachers Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>html,body{background:#0f172a;min-height:100dvh;margin:0;padding:0;font-family:Plus Jakarta Sans,Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}#boot-splash{z-index:999999;color:#f8fafc;background:#0f172a;flex-direction:column;justify-content:center;align-items:center;gap:1rem;transition:opacity .3s,visibility .3s;display:flex;position:fixed;inset:0}#boot-splash.boot-splash--out{opacity:0;visibility:hidden;pointer-events:none}.boot-logo-wrapper{background:#1e293b;border:1px solid #ffffff26;border-radius:20px;justify-content:center;align-items:center;width:80px;height:80px;animation:2s ease-in-out infinite pulseLogo;display:flex;box-shadow:0 20px 40px #0006,inset 0 1px #fff3}.boot-logo-img{object-fit:contain;width:52px;height:52px}@keyframes pulseLogo{0%,to{filter:brightness();transform:scale(1)}50%{filter:brightness(1.15);transform:scale(1.04)}}.boot-title{letter-spacing:-.02em;color:#fff;margin:0;font-size:1.25rem;font-weight:700}.boot-badge{text-transform:uppercase;letter-spacing:.08em;color:#34d399;background:#10b98126;border:1px solid #10b9814d;border-radius:9999px;align-items:center;gap:6px;padding:4px 12px;font-size:.75rem;font-weight:600;display:inline-flex}.boot-progress-track{background:#ffffff1a;border-radius:999px;width:180px;height:4px;margin-top:.5rem;overflow:hidden}.boot-progress-bar{background:#10b981;border-radius:999px;width:45%;height:100%;animation:1.4s ease-in-out infinite bootLoader}@keyframes bootLoader{0%{transform:translate(-100%)}to{transform:translate(250%)}}</style>
    <script type="module" crossorigin src="./assets/index-DiR6IkMV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DD3xEkM3.css">
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-logo-wrapper">
        <img class="boot-logo-img" src="./patternLogo.png" alt="GrowMore" onerror="this.style.display='none'" />
      </div>
      <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <h1 class="boot-title">GrowMore</h1>
        <div class="boot-badge">Teachers Panel</div>
      </div>
      <div class="boot-progress-track">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('boot-splash');
          if (splash) splash.classList.add('boot-splash--out');
        }, 350);
      });
    </script>
  </body>
</html>
